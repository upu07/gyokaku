name: 相場の毎日更新

on:
  schedule:
    # 毎日 13:30 JST（04:30 UTC）。日曜は取引がないので月〜土のみ
    - cron: "30 4 * * 1-6"
    # 夕方にも取り直して当日分を確定させる（18:30 JST）
    - cron: "30 9 * * 1-6"
  workflow_dispatch:
    inputs:
      backfill:
        description: "過去何日分をさかのぼって取得するか（0なら通常の更新）"
        default: "0"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency: market
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_market.py --backfill "${{ github.event.inputs.backfill || '0' }}"
      - name: 変更があればコミット
        run: |
          if git diff --quiet -- data/ && [ -z "$(git ls-files --others --exclude-standard data/)" ]; then echo "変更なし"; exit 0; fi
          git config user.name "market-bot"
          git config user.email "market-bot@users.noreply.github.com"
          git add data/market.json data/history.json
          git commit -m "相場データ更新 $(TZ=Asia/Tokyo date +%F)"
          # 取得中に main が進んでいても取り込んでから送る
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && exit 0; sleep 5; done
          exit 1
